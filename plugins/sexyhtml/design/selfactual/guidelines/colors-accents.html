<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;font-size:12px}.row{display:flex;gap:8px}.sw{flex:1;display:flex;flex-direction:column;gap:6px;font-family:var(--font-mono);font-size:10px;color:var(--color-neutral-600)}.sw i{display:block;height:44px;border-radius:var(--radius-sm)}.lbl{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--color-neutral-600);margin-bottom:8px}</style></head><body><div class="row"><div class="sw"><i style="background:var(--color-accent)"></i><span>--color-accent #2563eb</span></div><div class="sw"><i style="background:var(--color-accent-700)"></i><span>--color-accent-700 (text)</span></div><div class="sw"><i style="background:var(--color-accent-2)"></i><span>--color-accent-2 #06b6d4</span></div><div class="sw"><i style="background:var(--color-ink-accent)"></i><span>--color-ink-accent #38bdf8</span></div><div class="sw"><i style="background:var(--color-ink-accent-2)"></i><span>--color-ink-accent-2 #67e8f9</span></div></div></body></html>
