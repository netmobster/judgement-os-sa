<!-- @dsCard group="Spacing" viewport="700x190" name="Elevation" subtitle="Ink-tinted and shallow; only the product window gets --shadow-window" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;font-size:12px}.row{display:flex;gap:8px}.sw{flex:1;display:flex;flex-direction:column;gap:6px;font-family:var(--font-mono);font-size:10px;color:var(--color-neutral-600)}.sw i{display:block;height:44px;border-radius:var(--radius-sm)}.lbl{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--color-neutral-600);margin-bottom:8px}</style></head><body><div class="row" style="gap:20px;padding:10px"><div class="sw"><i style="height:80px;background:#fff;border-radius:var(--radius-sm);box-shadow:var(--shadow-sm)"></i><span>--shadow-sm</span></div><div class="sw"><i style="height:80px;background:#fff;border-radius:var(--radius-sm);box-shadow:var(--shadow-md)"></i><span>--shadow-md</span></div><div class="sw"><i style="height:80px;background:#fff;border-radius:var(--radius-sm);box-shadow:var(--shadow-lg)"></i><span>--shadow-lg</span></div><div class="sw"><i style="height:80px;background:var(--color-console-bg);border-radius:var(--radius-sm);box-shadow:var(--shadow-window)"></i><span>--shadow-window</span></div></div></body></html>
