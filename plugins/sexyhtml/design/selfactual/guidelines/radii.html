<!-- @dsCard group="Spacing" viewport="700x150" name="Radii" subtitle="Squared geometry — 28px is the limit, no pills" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;font-size:12px}.row{display:flex;gap:8px}.sw{flex:1;display:flex;flex-direction:column;gap:6px;font-family:var(--font-mono);font-size:10px;color:var(--color-neutral-600)}.sw i{display:block;height:44px;border-radius:var(--radius-sm)}.lbl{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--color-neutral-600);margin-bottom:8px}</style></head><body><div class="row"><div class="sw"><i style="height:64px;background:#fff;border:1px solid var(--color-divider);border-radius:var(--radius-xs)"></i><span>--radius-xs 3px</span></div><div class="sw"><i style="height:64px;background:#fff;border:1px solid var(--color-divider);border-radius:var(--radius-sm)"></i><span>--radius-sm 6px</span></div><div class="sw"><i style="height:64px;background:#fff;border:1px solid var(--color-divider);border-radius:var(--radius-md)"></i><span>--radius-md 16px</span></div><div class="sw"><i style="height:64px;background:#fff;border:1px solid var(--color-divider);border-radius:var(--radius-lg)"></i><span>--radius-lg 28px</span></div></div></body></html>
