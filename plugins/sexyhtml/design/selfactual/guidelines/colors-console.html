<!-- @dsCard group="Colors" viewport="700x170" name="Console family" subtitle="Slate-teal for the product window only — never decoration" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;font-size:12px}.row{display:flex;gap:8px}.sw{flex:1;display:flex;flex-direction:column;gap:6px;font-family:var(--font-mono);font-size:10px;color:var(--color-neutral-600)}.sw i{display:block;height:44px;border-radius:var(--radius-sm)}.lbl{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--color-neutral-600);margin-bottom:8px}</style></head><body><div style="background:var(--color-console-bg);padding:16px;border-radius:var(--radius-sm);border:1.5px solid var(--color-console-line)"><div class="row"><div class="sw" style="color:var(--color-console-muted)"><i style="background:var(--color-console-panel)"></i><span>panel</span></div><div class="sw" style="color:var(--color-console-muted)"><i style="background:var(--color-console-line)"></i><span>line</span></div><div class="sw" style="color:var(--color-console-muted)"><i style="background:var(--color-console-text)"></i><span>text</span></div><div class="sw" style="color:var(--color-console-muted)"><i style="background:var(--color-console-body)"></i><span>body</span></div><div class="sw" style="color:var(--color-console-muted)"><i style="background:var(--color-console-muted)"></i><span>muted</span></div><div class="sw" style="color:var(--color-console-muted)"><i style="background:var(--color-console-accent)"></i><span>accent</span></div><div class="sw" style="color:var(--color-console-muted)"><i style="background:var(--color-console-edge)"></i><span>edge</span></div><div class="sw" style="color:var(--color-console-muted)"><i style="background:var(--color-console-alert)"></i><span>alert</span></div></div></div></body></html>
