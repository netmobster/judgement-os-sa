<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;font-size:12px}.row{display:flex;gap:8px}.sw{flex:1;display:flex;flex-direction:column;gap:6px;font-family:var(--font-mono);font-size:10px;color:var(--color-neutral-600)}.sw i{display:block;height:44px;border-radius:var(--radius-sm)}.lbl{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--color-neutral-600);margin-bottom:8px}</style></head><body><div class="row"><div class="sw"><i style="background:var(--color-neutral-100)"></i><span>100</span></div><div class="sw"><i style="background:var(--color-neutral-200)"></i><span>200</span></div><div class="sw"><i style="background:var(--color-neutral-300)"></i><span>300</span></div><div class="sw"><i style="background:var(--color-neutral-400)"></i><span>400</span></div><div class="sw"><i style="background:var(--color-neutral-500)"></i><span>500</span></div><div class="sw"><i style="background:var(--color-neutral-600)"></i><span>600</span></div><div class="sw"><i style="background:var(--color-neutral-700)"></i><span>700</span></div><div class="sw"><i style="background:var(--color-neutral-800)"></i><span>800</span></div><div class="sw"><i style="background:var(--color-neutral-900)"></i><span>900</span></div></div></body></html>
