<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;font-size:12px}.row{display:flex;gap:8px}.sw{flex:1;display:flex;flex-direction:column;gap:6px;font-family:var(--font-mono);font-size:10px;color:var(--color-neutral-600)}.sw i{display:block;height:44px;border-radius:var(--radius-sm)}.lbl{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--color-neutral-600);margin-bottom:8px}</style></head><body><div class="row"><div class="sw"><i style="background:var(--color-bg);border:1px solid var(--color-divider)"></i><span>--color-bg #fafaf7</span></div><div class="sw"><i style="background:var(--color-surface)"></i><span>--color-surface #f1f0ec</span></div><div class="sw"><i style="background:var(--color-text)"></i><span>--color-text #16181d</span></div><div class="sw"><i style="background:var(--color-ink)"></i><span>--color-ink #101418</span></div><div class="sw"><i style="background:var(--color-ink-surface)"></i><span>--color-ink-surface #1c222b</span></div></div></body></html>
