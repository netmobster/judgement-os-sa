<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;font-size:12px}.row{display:flex;gap:8px}.sw{flex:1;display:flex;flex-direction:column;gap:6px;font-family:var(--font-mono);font-size:10px;color:var(--color-neutral-600)}.sw i{display:block;height:44px;border-radius:var(--radius-sm)}.lbl{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--color-neutral-600);margin-bottom:8px}</style></head><body><div class="on-ink" style="padding:16px;border-radius:var(--radius-md)"><div class="row"><div class="sw" style="color:var(--color-ink-dim)"><i style="background:var(--color-ink-surface)"></i><span>ink-surface</span></div><div class="sw" style="color:var(--color-ink-dim)"><i style="background:var(--color-ink-text)"></i><span>ink-text</span></div><div class="sw" style="color:var(--color-ink-dim)"><i style="background:var(--color-ink-muted)"></i><span>ink-muted</span></div><div class="sw" style="color:var(--color-ink-dim)"><i style="background:var(--color-ink-dim)"></i><span>ink-dim</span></div><div class="sw" style="color:var(--color-ink-dim)"><i style="background:var(--color-ink-faint)"></i><span>ink-faint</span></div><div class="sw" style="color:var(--color-ink-dim)"><i style="background:var(--color-ink-accent)"></i><span>ink-accent</span></div><div class="sw" style="color:var(--color-ink-dim)"><i style="background:var(--color-ink-accent-2)"></i><span>ink-accent-2</span></div></div></div></body></html>
