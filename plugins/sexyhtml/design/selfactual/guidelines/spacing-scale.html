<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;font-size:12px}.row{display:flex;gap:8px}.sw{flex:1;display:flex;flex-direction:column;gap:6px;font-family:var(--font-mono);font-size:10px;color:var(--color-neutral-600)}.sw i{display:block;height:44px;border-radius:var(--radius-sm)}.lbl{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--color-neutral-600);margin-bottom:8px}</style></head><body><div style="display:flex;align-items:flex-end;gap:24px;font-family:var(--font-mono);font-size:10px;color:var(--color-neutral-600)"><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><i style="display:block;width:var(--space-1);height:var(--space-1);background:var(--color-accent);border-radius:2px"></i><span>--space-1</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><i style="display:block;width:var(--space-2);height:var(--space-2);background:var(--color-accent);border-radius:2px"></i><span>--space-2</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><i style="display:block;width:var(--space-3);height:var(--space-3);background:var(--color-accent);border-radius:2px"></i><span>--space-3</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><i style="display:block;width:var(--space-4);height:var(--space-4);background:var(--color-accent);border-radius:2px"></i><span>--space-4</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><i style="display:block;width:var(--space-6);height:var(--space-6);background:var(--color-accent);border-radius:2px"></i><span>--space-6</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><i style="display:block;width:var(--space-8);height:var(--space-8);background:var(--color-accent);border-radius:2px"></i><span>--space-8</span></div></div></body></html>
