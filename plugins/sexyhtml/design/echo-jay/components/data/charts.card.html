<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{padding:16px;background:var(--ej-desk)}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../../_ds_bundle.js"></script></head><body><div id="root"></div><script type="text/babel">
const DS = (() => { for (const k of Object.keys(window)) { try { const v = window[k]; if (v && typeof v === 'object' && typeof v.Panel === 'function' && typeof v.Readout === 'function') return v; } catch (e) {} } return {}; })();
function Both({ stack, children }) { const g = t => <div data-theme={t} style={{ background: 'var(--ej-bg)', color: 'var(--ej-fg)', padding: 16, border: '1px solid var(--ej-line-strong)' }}><span className="ej-label" style={{ display: 'block', marginBottom: 10 }}>{t}</span>{children}</div>; return <div style={{ display: 'grid', gridTemplateColumns: stack ? '1fr' : '1fr 1fr', gap: 12 }}>{g('light')}{g('dark')}</div>; }
const { LineChart, SmallMultiples, Figure } = DS;
const demo = <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
  <Figure num="FIG.02" label="Series" meta="Label" caption={<><b>One sentence that states the figure's point.</b></>}><LineChart values={[2, 3, 2, 6, 4, 7, 9]} axisY showValues axis={['Mon', 'Sun']} /></Figure>
  <SmallMultiples hi={0} items={[{ label: 'One', values: [3, 4, 5, 6, 9] }, { label: 'Two', values: [1, 2, 2, 3, 4] }, { label: 'Three', values: [0, 1, 1, 0, 1] }]} />
  <SmallMultiples kind="line" columns={2} hi={1} items={[{ label: 'Series one', values: [3, 5, 6, 7, 7, 7] }, { label: 'Series two', values: [1, 2, 4, 5, 6, 7] }]} />
</div>;
function App() { return <Both>{demo}</Both>; }
ReactDOM.createRoot(document.getElementById('root')).render(<App />);</script></body></html>
