<!-- @dsCard group="Components" viewport="1080x480" name="Timeline" subtitle="Dated steps down the page, and the horizontal variant for slides" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{padding:16px;background:var(--ej-desk)}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../../_ds_bundle.js"></script></head><body><div id="root"></div><script type="text/babel">
const DS = (() => { for (const k of Object.keys(window)) { try { const v = window[k]; if (v && typeof v === 'object' && typeof v.Panel === 'function' && typeof v.Readout === 'function') return v; } catch (e) {} } return {}; })();
function Both({ stack, children }) { const g = t => <div data-theme={t} style={{ background: 'var(--ej-bg)', color: 'var(--ej-fg)', padding: 16, border: '1px solid var(--ej-line-strong)' }}><span className="ej-label" style={{ display: 'block', marginBottom: 10 }}>{t}</span>{children}</div>; return <div style={{ display: 'grid', gridTemplateColumns: stack ? '1fr' : '1fr 1fr', gap: 12 }}>{g('light')}{g('dark')}</div>; }
const { Timeline } = DS;
const items = [
  { date: 'MM.DD', title: 'Step one done', line: 'What happened, in one line.', state: 'done' },
  { date: 'MM.DD', title: 'Step two done', line: 'What it changed, in one line.', state: 'done' },
  { date: 'MM.DD', title: 'The next step', line: 'What it will change.', state: 'next' },
  { date: 'MM.DD', title: 'A later step', line: 'Not started yet.', state: 'open' },
];
const demo = <div style={{ display: 'flex', flexDirection: 'column', gap: 24 }}><Timeline items={items} /><Timeline horizontal items={items} /></div>;
function App() { return <Both>{demo}</Both>; }
ReactDOM.createRoot(document.getElementById('root')).render(<App />);</script></body></html>
