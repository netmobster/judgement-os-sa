<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{padding:20px;background:var(--ej-bg)}.sec{margin-bottom:18px}.lbl{margin:0 0 8px;display:block}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../../_ds_bundle.js"></script></head><body><div id="root"></div><script type="text/babel">
const DS = (() => { for (const k of Object.keys(window)) { try { const v = window[k]; if (v && typeof v === 'object' && typeof v.Panel === 'function' && typeof v.Readout === 'function') return v; } catch (e) {} } return {}; })();
const { Shell, Readout, TitleBlock, Divider } = DS;
function App(){ return <div style={{display:'flex',justifyContent:'center'}}><Shell framed meta="01 // Label" readout={<Readout items={[{text:'SYS.ECHO',dot:true},{text:'14:02:33',live:true}]} end="YYYY.MM.DD" />} footer={['ECHO-JAY // Footer','END OF FILE']} style={{margin:0}}>
<TitleBlock title="Title" subtitle="Subtitle: one to three plain sentences." byline={['Byline','YYYY.MM.DD']} />
<div className="ej-content"><p>Paragraph: body text in the owner's words.</p><Divider /><p className="ej-muted">The header casts a shadow down, the footer casts one up; the readout strip is recessed and scan-lined.</p></div>
</Shell></div>; }
ReactDOM.createRoot(document.getElementById('root')).render(<App />);</script></body></html>
