<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px 20px;background:var(--ej-bg)}.row{display:flex;gap:8px}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;font-family:var(--ej-font-mono);font-size:10px;letter-spacing:.06em;color:var(--ej-fg-faint)}.sw i{display:block;height:44px;border:1px solid var(--ej-line)}.sw b{font-weight:400;color:var(--ej-fg-muted)}</style></head><body><div class="row" style="align-items:flex-start"><div class="sw" style="flex:2"><div style="font-size:15px;color:var(--ej-fg);line-height:1.5">--ej-fg · Body and titles. #0f1720</div><div style="font-size:15px;color:var(--ej-fg-muted);line-height:1.5">--ej-fg-muted · Subtitles, table body, secondary copy. #4f6076</div><div class="ej-label" style="margin-top:4px">--ej-fg-faint · labels, bylines, axes · #627186</div></div><div class="sw"><i style="background:var(--ej-fg)"></i><span>--ej-fg</span><b>#0f1720</b></div><div class="sw"><i style="background:var(--ej-fg-muted)"></i><span>--ej-fg-muted</span><b>#4f6076</b></div><div class="sw"><i style="background:var(--ej-fg-faint)"></i><span>--ej-fg-faint</span><b>#627186</b></div></div></body></html>
