<!-- @dsCard group="Spacing" viewport="700x170" name="Elevation · raised and recessed" subtitle="Raised = steel-tinted drop + 1px bevel. Recessed = inset shadow. Gold fills carry a bevel" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px 20px;background:var(--ej-bg)}.row{display:flex;gap:8px}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;font-family:var(--ej-font-mono);font-size:10px;letter-spacing:.06em;color:var(--ej-fg-faint)}.sw i{display:block;height:44px;border:1px solid var(--ej-line)}.sw b{font-weight:400;color:var(--ej-fg-muted)}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:stretch">
<div class="ej-panel ej-panel-plain" style="padding:12px"><span class="ej-label">raised</span><div style="font-size:12px;color:var(--ej-fg-muted);margin-top:4px">--ej-shadow-raise + --ej-bevel</div></div>
<div class="ej-code" style="white-space:normal;font-family:var(--ej-font-body);font-size:12px"><span class="ej-label">recessed</span><div style="color:var(--ej-fg-muted);margin-top:4px">--ej-shadow-inset</div></div>
<div style="display:flex;flex-direction:column;gap:8px;justify-content:center"><button class="ej-btn ej-btn-primary" type="button">bevel gold</button><button class="ej-btn ej-btn-secondary" type="button">raised</button></div>
<div style="display:flex;flex-direction:column;gap:8px;justify-content:center"><input class="ej-input" placeholder="recessed input"><div style="display:flex;gap:10px;align-items:baseline"><span class="ej-figure">12</span><span class="ej-label">glow</span></div></div>
</div></body></html>
