<!-- @dsCard group="Colors" viewport="700x120" name="Status" subtitle="Only for tags and status rows. Gold already means live" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px 20px;background:var(--ej-bg)}.row{display:flex;gap:8px}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;font-family:var(--ej-font-mono);font-size:10px;letter-spacing:.06em;color:var(--ej-fg-faint)}.sw i{display:block;height:44px;border:1px solid var(--ej-line)}.sw b{font-weight:400;color:var(--ej-fg-muted)}</style></head><body><div class="row" style="align-items:center"><div class="sw"><i style="background:var(--ej-ok)"></i><span>--ej-ok</span><b>#2e7d4f</b></div><div class="sw"><i style="background:var(--ej-ok-tint)"></i><span>--ej-ok-tint</span><b>#e3f3ea</b></div><div class="sw"><i style="background:var(--ej-alert)"></i><span>--ej-alert</span><b>#b3261e</b></div><div class="sw"><i style="background:var(--ej-alert-tint)"></i><span>--ej-alert-tint</span><b>#fbe6e4</b></div><div class="sw" style="flex:2;justify-content:center"><div class="ej-tag-row"><span class="ej-tag ej-tag-ok">passing</span><span class="ej-tag ej-tag-alert">blocked</span><span class="ej-tag ej-tag-gold">live</span><span class="ej-tag">draft</span></div></div></div></body></html>
