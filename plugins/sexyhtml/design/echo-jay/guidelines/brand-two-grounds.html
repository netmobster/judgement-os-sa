<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px 20px;background:var(--ej-bg)}.row{display:flex;gap:8px}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;font-family:var(--ej-font-mono);font-size:10px;letter-spacing:.06em;color:var(--ej-fg-faint)}.sw i{display:block;height:44px;border:1px solid var(--ej-line)}.sw b{font-weight:400;color:var(--ej-fg-muted)}.g{flex:1;padding:14px;border:1px solid var(--ej-line-strong);background:var(--ej-bg);color:var(--ej-fg)}</style></head><body><div class="row"><div class="g"><div style="display:flex;gap:10px;align-items:center"><span class="ej-nameplate" style="font-size:14px">FOR NAME</span><span class="ej-label">light</span></div><div class="ej-panel" style="margin-top:12px;padding:10px 12px"><div class="ej-panel-head" style="margin-bottom:4px"><span class="ej-label">FIG.01</span><span class="ej-figure" style="font-size:18px">12</span></div><div class="ej-bars" style="height:30px"><div class="ej-bar" style="--v:40%"></div><div class="ej-bar" style="--v:70%"></div><div class="ej-bar ej-bar-hi" style="--v:100%"></div></div></div><div class="ej-btn-row" style="margin-top:10px"><button class="ej-btn ej-btn-primary ej-btn-sm" type="button">Copy text</button><button class="ej-btn ej-btn-secondary ej-btn-sm" type="button">Open link</button></div></div>
<div class="g" data-theme="dark"><div style="display:flex;gap:10px;align-items:center"><span class="ej-nameplate" style="font-size:14px">FOR NAME</span><span class="ej-label">dark</span></div><div class="ej-panel" style="margin-top:12px;padding:10px 12px"><div class="ej-panel-head" style="margin-bottom:4px"><span class="ej-label">FIG.01</span><span class="ej-figure" style="font-size:18px">12</span></div><div class="ej-bars" style="height:30px"><div class="ej-bar" style="--v:40%"></div><div class="ej-bar" style="--v:70%"></div><div class="ej-bar ej-bar-hi" style="--v:100%"></div></div></div><div class="ej-btn-row" style="margin-top:10px"><button class="ej-btn ej-btn-primary ej-btn-sm" type="button">Copy text</button><button class="ej-btn ej-btn-secondary ej-btn-sm" type="button">Open link</button></div></div></div></body></html>
