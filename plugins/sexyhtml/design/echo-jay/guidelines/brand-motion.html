<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:16px 20px;background:var(--ej-bg)}.row{display:flex;gap:8px}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;font-family:var(--ej-font-mono);font-size:10px;letter-spacing:.06em;color:var(--ej-fg-faint)}.sw i{display:block;height:44px;border:1px solid var(--ej-line)}.sw b{font-weight:400;color:var(--ej-fg-muted)}</style></head><body><div style="display:flex;gap:28px;align-items:center"><span class="ej-label"><span class="ej-dot"></span>ej-dot · blink 2s</span><span class="ej-readout-live" style="font-family:var(--ej-font-mono);font-size:13px;letter-spacing:.1em" id="c">14:02:33</span><span class="ej-figure">12</span><span class="ej-label">ej-pulse · 3s</span><span class="ej-label" style="margin-left:auto">prefers-reduced-motion stops all of it</span></div>
<script>var c=document.getElementById('c'),p=function(n){return String(n).padStart(2,'0')};setInterval(function(){var d=new Date();c.textContent=p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())},1000)</script></body></html>
